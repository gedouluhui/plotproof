name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Debug worker reply
        if: runner.os == 'Linux'
        run: |
          python - <<'PY'
          from hashlib import sha256
          import matplotlib
          matplotlib.use('Agg')
          import matplotlib.pyplot as plt
          from plotproof.pdf_input import PdfLimits, _run_worker
          fig, ax = plt.subplots(figsize=(4, 3), dpi=100)
          ax.set_title('hello')
          fig.savefig('/tmp/x.pdf')
          data = open('/tmp/x.pdf', 'rb').read()
          reply = _run_worker(data, PdfLimits(), None)
          print('top', sorted(reply))
          print('ok', reply.get('ok'), 'error', reply.get('error'))
          body = reply.get('snapshot') or {}
          print('keys', sorted(body))
          for key in ('input_sha256', 'pypdfium2_version', 'pdfium_version', 'page_count',
                      'rotation', 'page_size_pt', 'cropbox', 'mediabox', 'char_count'):
              print(key, repr(body.get(key)))
          chars = body.get('characters') or []
          print('chars', len(chars), 'first', chars[:2])
          print('sha', sha256(data).hexdigest())
          PY
      - name: Test
        run: python -m pytest -q
      - name: Validate frozen benchmark manifest
        run: python benchmark/validate_manifest.py
      - name: Demo reports
        run: python -m plotproof demo --output ci-demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-${{ matrix.os }}
          path: ci-demo/
          if-no-files-found: ignore
