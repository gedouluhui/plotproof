[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plotproof"
version = "0.1.0a1"
description = "Source-assisted export evidence for Matplotlib figures (B1 preview: clipped/overlapping text, no font evidence)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "PlotProof contributors" }]
keywords = ["matplotlib", "pdf", "figure", "accessibility", "chart", "quality"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "matplotlib==3.10.8",
    "numpy>=2,<3",
    "pypdfium2>=5,<6",
    "fonttools>=4.60,<5",
    "pillow>=10,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
]

[project.scripts]
plotproof = "plotproof.cli:main"

[tool.setuptools]
packages = ["plotproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
